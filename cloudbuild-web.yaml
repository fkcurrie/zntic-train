steps:
- name: 'ubuntu'
  id: 'Set Build Date'
  args:
  - 'bash'
  - '-c'
  - |
    echo "{"build_date": "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"}" > web/build-info.json
    echo "Generated build info:"
    cat web/build-info.json

- name: 'gcr.io/cloud-builders/docker'
  id: 'Build Web Image'
  args:
  - 'build'
  - '-t'
  - 'gcr.io/gca-gke-2025/zoonotic-web:latest'
  - '-f'
  - 'web.Dockerfile'
  - '.'

- name: 'gcr.io/cloud-builders/docker'
  id: 'Push Web Image'
  args: ['push', 'gcr.io/gca-gke-2025/zoonotic-web:latest']

images:
- 'gcr.io/gca-gke-2025/zoonotic-web:latest'