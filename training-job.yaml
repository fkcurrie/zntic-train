apiVersion: batch/v1
kind: Job
metadata:
  # The name will be dynamically generated by the API
  name: training-job-placeholder
spec:
  template:
    spec:
      serviceAccountName: zntic-gke-sa
      containers:
      - name: training-container
        image: gcr.io/gca-gke-2025/training:latest
        imagePullPolicy: Always
        command: ["python", "scripts/train.py"]
        # Args will be dynamically populated by the API
        args: [
          "--model-type", "LogisticRegression",
          "--model-name", "default-model",
          "--hyperparams", "{}"
        ]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
      restartPolicy: Never
  backoffLimit: 2
