steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/gca-gke-2025/zoonotic-api', '-f', 'api/api.Dockerfile', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/gca-gke-2025/zoonotic-api']
images:
- 'gcr.io/gca-gke-2025/zoonotic-api'
logsBucket: 'gs://zntic-data/logs'
options:
  logging: GCS_ONLY