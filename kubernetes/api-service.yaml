apiVersion: v1
kind: Service
metadata:
  name: zoonotic-api-service
  annotations:
    cloud.google.com/app-protocols: '{"http-port":"HTTP"}'
    cloud.google.com/health-check-path: "/health"
spec:
  type: LoadBalancer
  selector:
    app: zoonotic-api
  ports:
  - name: http-port
    protocol: TCP
    port: 80
    targetPort: 8080
