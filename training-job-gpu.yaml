apiVersion: batch/v1
kind: Job
metadata:
  # The name will be dynamically generated by the API
  name: training-job-gpu-placeholder
spec:
  template:
    spec:
      serviceAccountName: zntic-gke-sa
      containers:
      - name: training-container
        image: gcr.io/gca-gke-2025/training:latest
        imagePullPolicy: Always
        command: ["python", "scripts/train.py"]
        # Args will be dynamically populated by the API
        args: [
          "--model-type", "NeuralNetwork",
          "--model-name", "nn-model",
          "--hyperparams", "{}"
        ]
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi" # Increased memory for TensorFlow
          limits:
            cpu: "1"
            memory: "4Gi"
            nvidia.com/gpu: "1" # Request 1 GPU
      restartPolicy: Never
      # Node selection for GPU pool
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-accelerator: "nvidia-tesla-t4"
  backoffLimit: 2
